name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Validate release metadata
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${GITHUB_REF_NAME#v}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(cat VERSION)" = "${version}"
          grep -Fq "## [${version}]" CHANGELOG.md
          git cat-file -t "${GITHUB_REF_NAME}" | grep -qx tag
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
      - name: Verify source
        run: make check
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            format: tar.gz
          - os: linux
            arch: arm64
            format: tar.gz
          - os: darwin
            arch: amd64
            format: tar.gz
          - os: darwin
            arch: arm64
            format: tar.gz
          - os: windows
            arch: amd64
            format: zip
          - os: windows
            arch: arm64
            format: zip
          - os: freebsd
            arch: amd64
            format: tar.gz
          - os: freebsd
            arch: arm64
            format: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Build archive
        env:
          ARCH: ${{ matrix.arch }}
          OS: ${{ matrix.os }}
          FORMAT: ${{ matrix.format }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          version="${VERSION#v}"
          package="netvex-${VERSION}-${OS}-${ARCH}"
          binary="netvex"
          if test "${OS}" = windows; then binary="netvex.exe"; fi
          mkdir -p "dist/${package}"
          build_date="$(git show -s --format=%cI HEAD)"
          CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" go build -mod=readonly -trimpath -buildvcs=false -ldflags "-s -w -X github.com/drag-team/netvex/internal/buildinfo.Version=${version} -X github.com/drag-team/netvex/internal/buildinfo.Commit=${COMMIT} -X github.com/drag-team/netvex/internal/buildinfo.Date=${build_date}" -o "dist/${package}/${binary}" ./cmd/netvex
          cp README.md LICENSE CHANGELOG.md "dist/${package}/"
          if test "${FORMAT}" = zip; then
            cd dist
            python3 -m zipfile -c "${package}.zip" "${package}"
          else
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
            cd dist
          fi
          sha256sum "${package}.${FORMAT}" > "${package}.${FORMAT}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: netvex-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "NetVex ${GITHUB_REF_NAME}"
