name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Test
        run: make test
      - name: Build archive
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          package="relayprobe-${VERSION}-linux-${ARCH}"
          mkdir -p "dist/${package}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build -trimpath -ldflags "-s -w -X github.com/drag-team/relayprobe/internal/buildinfo.Version=${VERSION} -X github.com/drag-team/relayprobe/internal/buildinfo.Commit=${COMMIT} -X github.com/drag-team/relayprobe/internal/buildinfo.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "dist/${package}/relayprobe" ./cmd/relayprobe
          cp README.md LICENSE CHANGELOG.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: relayprobe-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "RelayProbe ${GITHUB_REF_NAME}"
